name: Build, Test, and Deploy

on: [push, pull_request]

jobs:
  job1:
    environment: testing
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fastapi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastapi_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastapi_test
      JWT_SECRET_KEY: "${{ secrets.JWT_SECRET_KEY }}"
      JWT_ALGORITHM: "${{ secrets.JWT_ALGORITHM }}"
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "${{ secrets.JWT_ACCESS_TOKEN_EXPIRE_MINUTES }}"

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --disable-warnings
