services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://neondb_owner:npg_C7PbWyHD5pYL@postgres:5432/neondb
      - JWT_ALGORITHM=HS256
      - JWT_SECRET_KEY=hgvjhgvnljbnhjgcbydtcbuygiunimgy7f656867ty98y867nf76t
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=60

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: neondb_owner
      POSTGRES_PASSWORD: npg_C7PbWyHD5pYL
      POSTGRES_DB: neondb
    ports:
      - "5432:5432"
    volumes:
      - postgres_db:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U neondb_owner -d neondb" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_db:
